name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest -v
      - name: Compile
        run: python -m compileall -q bokpilot tests
      - name: JavaScript syntax
        run: node --check bokpilot/resources/static/app.js
      - name: Installed wheel smoke
        run: python scripts/smoke_installed.py --build-wheel
      - name: Diff whitespace
        run: git diff --check

  required:
    name: CI
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python job
        run: test "${{ needs.verify.result }}" = "success"
