name: Synthetic parser fixture
description: Propose a redacted or synthetic bank/document parser case.
title: "[Parser]: "
labels: [parser]
body:
  - type: markdown
    attributes:
      value: "Fixtures must be synthetic or irreversibly redacted. Never upload a real bank export or document."
  - type: dropdown
    id: kind
    attributes:
      label: Source kind
      options: [Bank CSV, Receipt text, Supplier invoice text, Customer invoice text]
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic fixture
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected normalized fields or issues
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This fixture contains no real or re-identifiable financial or personal data.
          required: true
