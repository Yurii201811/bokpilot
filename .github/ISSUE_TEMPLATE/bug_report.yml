name: Bug report
description: Report a reproducible Bokpilot problem without private financial data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real receipts, invoices, bank exports, database files, backups, tokens, or personal data."
  - type: input
    id: version
    attributes:
      label: Bokpilot version
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: Use synthetic data and redact local paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real financial, personal, credential, and local-path data.
          required: true
