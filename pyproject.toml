[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bokpilot"
dynamic = ["version"]
description = "Local-first pre-accounting assistant for Swedish receipts, VAT, BAS accounts, and human-reviewed exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Bokpilot contributors" }
]
keywords = ["accounting", "bookkeeping", "sweden", "vat", "bas", "sie", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting"
]

[project.scripts]
bokpilot = "bokpilot.__main__:main"

[tool.setuptools]
packages = ["bokpilot"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "bokpilot.__version__"}

[tool.setuptools.package-data]
bokpilot = [
  "resources/static/*",
  "resources/samples/bank/*.csv",
  "resources/samples/invoices/*.txt",
  "resources/samples/receipts/*.txt",
]
