[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bokpilot"
version = "0.1.0"
description = "Local-first pre-accounting assistant for Swedish receipts, VAT, BAS accounts, and human-reviewed exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Bokpilot contributors" }
]
keywords = ["accounting", "bookkeeping", "sweden", "vat", "bas", "sie", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting"
]

[project.scripts]
bokpilot = "bokpilot.server:main"

[tool.setuptools]
packages = ["bokpilot"]
